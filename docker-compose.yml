version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cplms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cplmsdb}
      POSTGRES_USER: ${POSTGRES_USER:-cplms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction!123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cplms_admin} -d ${POSTGRES_DB:-cplmsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cplms-network

  # -------------------------------------------------------------
  # 2. Redis Cache & Job Queue
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cplms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cplms-network

  # -------------------------------------------------------------
  # 3. MinIO S3 Object Storage
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cplms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure_password}
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # Browser Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cplms-network

  minio-init:
    image: minio/mc:latest
    container_name: cplms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin_secure_password); do
        echo 'Waiting for MinIO S3 server to become ready...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/cplms-documents || true;
      /usr/bin/mc anonymous set download myminio/cplms-documents || true;
      echo 'MinIO bucket cplms-documents created and configured for public downloads!';
      exit 0;
      "
    networks:
      - cplms-network

  # -------------------------------------------------------------
  # 4. FastAPI AI Microservice
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cplms-ai-service
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cplms-network

  # -------------------------------------------------------------
  # 5. Core Spring Boot Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cplms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cplmsdb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-cplms_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeInProduction!123}
      - APP_JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - APP_AI_SERVICE_URL=http://ai-service:8000
      - APP_MINIO_ENDPOINT=http://minio:9000
      - APP_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - APP_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin_secure_password}
      - APP_SECURITY_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - cplms-network

  # -------------------------------------------------------------
  # 6. React Production Frontend (Nginx SPA)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cplms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cplms-network

networks:
  cplms-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
